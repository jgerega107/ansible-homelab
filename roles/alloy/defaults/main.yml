# Default set of templates to configure for Alloy, good for 99 percent of systems.
alloy_templates:
    - {
          src: "templates/config.alloy.discovery.j2",
          dest: "/etc/alloy/discovery.alloy",
      }
    - {
          src: "templates/config.alloy.prometheus.j2",
          dest: "/etc/alloy/prometheus.alloy",
      }
    - { src: "templates/config.alloy.loki.j2", dest: "/etc/alloy/loki.alloy" }

# Default remote endpoints for Alloy to send data to.
